function rewardLabel(r){
  if(!r) return '—';
  if(typeof r==='string') return r;
  const k=r.kind||'money', n=Number(r.amount)||0;
  if(k==='money') return '+'+n+' ₽';
  if(k==='days') return '+'+n+' '+t('дн.','d');
  if(k==='spins') return '+'+n+' '+t('круток','spins');
  if(k==='discount') return '+'+n+'%';
  if(k==='gb') return '+'+n+' GB';
  return (r.text||k)+' '+n;
}
function giveLevelReward(r){
  if(!r) return;
  if(typeof r==='string'){
    const m=parseInt(String(r).replace(/\D/g,''),10)||0;
    if(String(r).includes('%')) reward('discount',m,r);
    else if(/gb/i.test(String(r))) reward('gb',m,r);
    else if(/дн|day/i.test(String(r))) reward('days',m,r);
    else if(/крут|spin/i.test(String(r))) reward('spins',m,r);
    else if(/кейс|case/i.test(String(r))) reward('case',String(r),r);
    else reward('money',m||0,r);
    return;
  }
  const k=r.kind||'money';
  if(k==='case'){
    reward('case', r.caseId||r.amount||r.value||'', rewardLabel(r), {caseId:r.caseId||r.amount||r.value, from:'event'});
  } else {
    reward(k, Number(r.amount)||Number(r.value)||0, rewardLabel(r));
  }
}

function fmtLeft(ms){
  if(ms<=0) return '0';
  const s=Math.floor(ms/1000);
  const d=Math.floor(s/86400), h=Math.floor((s%86400)/3600), m=Math.floor((s%3600)/60);
  if(d>0) return d+(S.lang==='ru'?' д. ':' d ')+h+(S.lang==='ru'?' ч':' h');
  if(h>0) return h+(S.lang==='ru'?' ч ':' h ')+m+(S.lang==='ru'?' мин':' min');
  return m+(S.lang==='ru'?' мин':' min');
}
function evStatus(ev){
  const now=Date.now();
  const start=Number(ev.start)||0, end=Number(ev.end)||0;
  if(end && now>=end) return 'past';
  if(start && now<start) return 'soon';
  return 'live';
}

      }).join('')||'<p class="muted">—</p>'}</div>
      <b style="font-size:13px">${t('Задания подписки','Pass tasks')}</b>
      <div style="margin-top:8px">${tasks.map((task,i)=>{
        const open=now>=Number(ev.start)+i*DAY;
        const done=(joined.done||[]).includes(task.id);
        const need=task.amount?` · ${task.amount}`:'';
        return `<div style="margin-top:8px;padding:12px;border-radius:12px;background:var(--surface2);border:1px solid ${done?'var(--ok)':'var(--border)'}">

            <button class="btn ${done?'ghost':''}" style="min-height:36px;padding:0 12px" data-task="${task.id}" ${!open||done?'disabled':''}>${done?'✓':open?t('Готово','Done'):'⏳'}</button>
          </div>
        </div>`;
      }).join('')||`<p class="muted">${t('Нет заданий','No tasks')}</p>`}</div>`;
    } else if(st==='live'){
      body+=`<b style="font-size:13px">${t('Выберите подписку','Choose a pass')}</b>
      <p class="muted" style="font-size:12px;margin:6px 0 8px">${t('У каждой — свои задания и награды','Each has its own tasks and rewards')}</p>
      ${(ev.passes||[]).map(p=>`
        <div style="margin-top:10px;padding:12px;border-radius:12px;background:var(--surface2);border-left:4px solid ${p.color}">
          <div class="row" style="justify-content:space-between;margin-bottom:8px">
            <b>${p.name}</b><span>${p.price===0?t('бесплатно','free'):money(p.price)}</span>
          </div>
          <div class="muted" style="font-size:11px;margin-bottom:8px">${(p.levels||[]).length} LVL · ${(p.tasks||[]).length} ${t('заданий','tasks')}</div>
          <div style="margin-bottom:8px">${(p.levels||[]).map(l=>`<span class="chip">LVL ${l.level}: ${rewardLabel(l.reward)}</span>`).join('')}</div>
          <button class="btn block" style="background:${p.color};color:#111" data-pass="${ev.id}:${p.id}">${t('Выбрать','Select')}</button>
        </div>`).join('')}`;
    } else {
      body+=`<p class="muted">${t('Ивент завершён','Event ended')}</p>`;
      if(joined&&pass) body+=`<p class="muted" style="margin-top:6px">${pass.name} · LVL ${joined.level||0}</p>`;
    }
    body+=`</div></div>`;
    return body;
  };
  if(live.length){ out+=`<h3 style="font-size:13px;margin:0 0 8px">${t('Идут сейчас','Live')}</h3>`; live.forEach(ev=>{out+=renderEv(ev,'live')}); }
  if(soon.length){ out+=`<h3 style="font-size:13px;margin:12px 0 8px">${t('Скоро','Upcoming')}</h3>`; soon.forEach(ev=>{out+=renderEv(ev,'soon')}); }
  if(past.length){ out+=`<h3 style="font-size:13px;margin:12px 0 8px">${t('Прошедшие','Past')}</h3>`; past.forEach(ev=>{out+=renderEv(ev,'past')}); }
  return out;
}

function getShopCases(){
  const base=CASES.map(c=>({...c,emoji:c.id==='c25'?'🥉':c.id==='c50'?'🥈':'🥇',name:c.ru,shop:true,desc:'',color1:c.id==='c25'?'#92400e':c.id==='c50'?'#6b7280':'#a16207',color2:c.id==='c25'?'#f59e0b':c.id==='c50'?'#e5e7eb':'#fde047'}));

function getCaseById(id){

function bindTopupModal(){
  let amount=0;
  const prev=document.getElementById('topupPreview');
  const inp=document.getElementById('topupCustom');
  const setAmt=(n)=>{
    amount=Math.max(0,parseInt(String(n).replace(/\\D/g,''),10)||0);
    if(prev) prev.textContent=amount? (amount+' ₽') : '—';
    if(inp && document.activeElement!==inp) inp.value=amount?String(amount):'';
  };
  document.getElementById('topupClose').onclick=()=>{S.topupOpen=false;render();};
  document.getElementById('topupModalBg').onclick=e=>{ if(e.target.id==='topupModalBg'){S.topupOpen=false;render();} };
  document.getElementById('topupModalBox').onclick=e=>e.stopPropagation();
  document.querySelectorAll('[data-amt]').forEach(b=>{
    b.onclick=e=>{e.preventDefault();e.stopPropagation();setAmt(b.dataset.amt);if(inp)inp.value=String(b.dataset.amt);};
  });
  if(inp){
    inp.oninput=()=>{
      const n=parseInt(String(inp.value).replace(/\\D/g,''),10)||0;
      amount=n;
      if(prev) prev.textContent=n?(n+' ₽'):'—';
    };
    // delay focus so keyboard works on mobile
    setTimeout(()=>{try{inp.focus();}catch(e){}},50);
  }
  document.getElementById('topupGo').onclick=e=>{
    e.preventDefault();
    const fromInput=parseInt(String((inp&&inp.value)||'').replace(/\\D/g,''),10)||0;
    const finalAmt=fromInput||amount;
    if(!finalAmt||finalAmt<1){toast(t('Укажите сумму','Enter amount'));return;}
    S.topupOpen=false;
    S.pay={kind:'topup',amount:finalAmt};
    render();
  };
}

function bindSecret(){
  document.getElementById('admClose').onclick=()=>{S.secret=false;render()};
  const enter=()=>{
    const l=String((document.getElementById('admLogin')||{}).value||'').trim();
    const p=String((document.getElementById('admPass')||{}).value||'');
    const lu=l.toUpperCase();
    if(lu==='AAAP4GPMX' && p==='jodvpn2026'){
      S.isAdmin=true; S.adminRole='senior'; S.secret=false; S.adminOpen=true; S.adminSec='users';
      save(); toast(t('Старший админ','Senior admin')); render(); return;
    }
    // built-in admin (нельзя удалить)
    if(lu==='ADMIN' && p==='jodvpn2026'){
      S.isAdmin=true; S.adminRole='admin'; S.adminPerms={users:1,promos:1,support:1}; S.secret=false; S.adminOpen=true; S.adminSec='users';
      save(); toast(t('Админ','Admin')); render(); return;
    }
    // созданные админы
    const ad=(S.admins||[]).find(a=>a.login.toLowerCase()===l.toLowerCase() && a.pass===p);
    if(ad){
      if(ad.banned){toast(t('Админ забанен','Admin banned'));return}
      S.isAdmin=true; S.adminRole=ad.role||'admin'; S.adminPerms=permsOf(ad); S.secret=false; S.adminOpen=true; S.adminSec='users';
      stashProfile();S.login=ad.login;loadProfile(ad.login);
      save(); toast(t('Админ','Admin')); render(); return;
    }
    toast(t('Неверный логин или пароль','Wrong login or password'));
  };
  document.getElementById('admEnter').onclick=enter;
  const pass=document.getElementById('admPass');
  if(pass) pass.onkeydown=e=>{if(e.key==='Enter')enter()};
  const login=document.getElementById('admLogin');

}

function openInventoryCase(){
  const c=getCaseById(S.caseView); if(!c) return;
  const idx=S._openInvIdx;
  if(idx==null||!(S.myCases||[])[idx]){
    toast(t('Сначала купите кейс','Buy the case first')); return;
  }
  const drops=c.drops||[];
  if(!drops.length){toast(t('Пустой кейс','Empty case'));return;}
  // pick prize first
  const prize=pick(drops.map(d=>({...d,w:d.w||d.chance||1,l:d.l||rewardLabel(d)})));
  const label=prize.l||rewardLabel(prize);
  const iconOf=(d)=>{
    const k=d.k||d.kind||'';
    if(k==='money'||String(d.l||'').includes('₽')) return '💰';
    if(k==='days'||String(d.l||'').includes('дн')) return '📅';
    if(k==='spins'||String(d.l||'').includes('крут')) return '🎰';
    if(k==='discount'||String(d.l||'').includes('%')) return '🏷';
    if(k==='gb') return '📶';
    if(k==='case') return '📦';
    return d.emoji||'🎁';
  };
  // build long strip of icons
  const base=drops.map(d=>({icon:iconOf(d),l:d.l||rewardLabel(d)}));
  let strip=[];
  for(let i=0;i<12;i++) strip=strip.concat(base);
  const winIcon=iconOf(prize);
  // put winning item near end
  const winAt=strip.length-4;
  strip[winAt]={icon:winIcon,l:label};
  S.caseOpening=true;
  S.caseReel=strip;
  S.caseReelY=0;
  S.caseResult='';
  render();
  blip(400);
  requestAnimationFrame(()=>{
    const track=document.getElementById('caseReelTrack');
    if(track){
      const itemW=72;
      const target=-(winAt*itemW - (150-itemW/2));
      track.style.transition='none';
      track.style.transform='translateX(0)';
      void track.offsetHeight;
      track.style.transition='transform 3.4s cubic-bezier(.12,.75,.1,1)';
      track.style.transform='translateX('+target+'px)';
    }
  });
  setTimeout(()=>{
    if(prize.k==='case'||prize.kind==='case'){
      const nc=getCaseById(String(prize.caseId||prize.v||prize.value||''));
      if(nc){S.myCases=S.myCases||[];S.myCases.push({...nc,gotAt:Date.now(),from:'drop'})}
      reward('case', String(prize.caseId||prize.v||''), label, {from:'case'});
    } else if(prize.k||prize.kind){
      const kind=prize.k||prize.kind, val=prize.v!=null?prize.v:prize.amount;
      reward(['money','days','spins','discount','gb'].includes(kind)?kind:'money', Number(val)||0, label);
    } else {
      reward('money', Number(prize.v)||0, label);
    }
    S.caseResult=label;
    S.caseOpening=false;
    S.caseReel=null;
    if(typeof idx==='number') S.myCases.splice(idx,1);
    S._openInvIdx=null;
    S.stats.cases=(S.stats.cases||0)+1;
    syncSelf();
    render();
    toast(label);
  }, 3600);
}


function doSpinVertical(){
  if(S.banned){toast(t('Бан','Banned'));return}
  if(!active()){toast(t('Нужна активная подписка','Active plan required'));return}
  const err=chooseMode('wheel'); if(err){toast(err);return}
  const free=S.freeSpins>0;
  if(!free&&Date.now()-(S.lastWheel||0)<DAY){toast(t('Уже крутили сегодня','Already spun today'));return}
  if(S.spinning) return;
  const pool=wheelPool();
  const prize=pick(pool);
  const idx=pool.indexOf(prize);
  const cycle=pool.length*60;
  const target=-(2*cycle + idx*60);
  S.spinning=true;
  // reset to 0 without transition then animate
  const track=document.getElementById('vTrack');
  if(track){
    track.style.transition='none';
    track.style.transform='translateY(0px)';
    void track.offsetHeight;
    track.style.transition='transform 3.2s cubic-bezier(.12,.7,.1,1)';
    track.style.transform='translateY('+target+'px)';
  }
  S.vReelY=target;
  if(!free) S.lastWheel=Date.now(); else S.freeSpins=Math.max(0,(S.freeSpins||0)-1);
  S.mode='wheel'; S.modeLock=Date.now()+DAY;
  S.stats.spins=(S.stats.spins||0)+1;
  blip(280);
  setTimeout(()=>{
    if(prize.k!=='none') reward(prize.k,prize.v,prize.l);
    else S.rewards.unshift({id:uid(),name:t('Ничего','Nothing'),at:Date.now()});
    toast(prize.k==='none'?t('Ничего','Nothing'):prize.l);
    S.spinning=false;
    render();
  },3300);
}

function doSlotVertical(){
  if(Date.now()-(S.lastSlot||0)<DAY){toast(t('Уже крутили сегодня','Already today'));return}
  if(S.spinning) return;
  const prize=pick(SLOT);
  const labels=['+1 ₽','+3 ₽','+5 ₽','+10 ₽','+50 ₽','+100 ₽'];
  const idx=Math.max(0,labels.indexOf(prize.l));
  const cycle=6*60;
  const target=-(2*cycle + idx*60);
  S.spinning=true;
  const track=document.getElementById('slotTrack');
  if(track){
    track.style.transition='none';
    track.style.transform='translateY(0px)';
    void track.offsetHeight;
    track.style.transition='transform 3.2s cubic-bezier(.12,.7,.1,1)';

  }

  S.stats.slots=(S.stats.slots||0)+1;
  blip(320);
  setTimeout(()=>{
    reward('money',prize.v,prize.l);

}



function syncEvDraftFromDom(){
  const d=S.evDraft||{passes:[],levels:[],tasks:[]};
  const nameEl=document.getElementById('evName');
  const themeEl=document.getElementById('evTheme');
  const startEl=document.getElementById('evStart');
  const endEl=document.getElementById('evEnd');
  if(nameEl) d.name=nameEl.value||'';
  if(themeEl) d.theme=themeEl.value||'default';
  if(startEl) d.start=startEl.value||'';
  if(endEl) d.end=endEl.value||'';
  const pi=S.evPassTab||0;
  if(!d.passes) d.passes=[];
  if(d.passes[pi]){
    const p=d.passes[pi];
    const nm=document.querySelector('[data-pass-name="'+pi+'"]');
    const pr=document.querySelector('[data-pass-price="'+pi+'"]');
    const cl=document.querySelector('[data-pass-color="'+pi+'"]');
    if(nm) p.name=nm.value||p.name;
    if(pr) p.price=Number(pr.value||0);
    if(cl) p.color=cl.value||p.color;
    p.levels=(p.levels||[]).map((l,i)=>{
      const kind=(document.querySelector('[data-lvl-kind="'+i+'"]')||{}).value||'money';
      const amountEl=document.querySelector('[data-lvl-amount="'+i+'"]');
      const caseEl=document.querySelector('[data-lvl-case="'+i+'"]');
      const reward={kind:kind, amount:Number((amountEl||{}).value||0)};
      if(kind==='case'){
        reward.caseId=String((caseEl&&caseEl.value)||'').trim();
        reward.amount=reward.caseId; // also keep for older paths
      }
      return {level:Number((document.querySelector('[data-lvl-n="'+i+'"]')||{}).value||(i+1)), reward:reward};
    });
    p.tasks=(p.tasks||[]).map((tk,i)=>({
      text:(document.querySelector('[data-task-text="'+i+'"]')||{}).value||tk.text,
      kind:(document.querySelector('[data-task-kind="'+i+'"]')||{}).value||tk.kind,
      amount:Number((document.querySelector('[data-task-amount="'+i+'"]')||{}).value||0)
    }));
  }
  S.evDraft=d;return d;
}

function chooseMode(m){
  const now=Date.now(), dual=S.dualUntil>now;
  if(dual){ S.mode=m; return null; }
  // if never used other mode, allow switch freely until one is used
  if(m==='wheel' && S.mode==='tap' && (S.tapsToday||0)>0 && S.modeLock>now){
    return t('Сейчас режим тапа (24ч)','Tap mode active (24h)');
  }
  if(m==='tap' && S.mode==='wheel' && S.lastWheel && (now-S.lastWheel)<DAY && S.modeLock>now){
    return t('Сейчас режим барабана (24ч)','Wheel mode active (24h)');
  }
  if(S.mode!==m){
    S.mode=m;
    // lock only after an actual play sets modeLock
  }
  return null;
}

function openCell(i){if(!S.mines||S.minesDone||S.minesLives<=0)return;const cell=S.mines[i];if(!cell||cell.open)return;cell.open=true;if(cell.kind==='bomb'){S.mines.forEach(c=>{if(c.kind==='bomb')c.open=true});S.minesLives=0;S.minesDone=true;S.stats.mines++;toast(t('Бомба','Bomb'));render();return}S.minesLives--;if(cell.kind==='reward'&&cell.label){if(cell.label.includes('%'))reward('discount',parseInt(cell.label,10)||1,cell.label);else reward('money',parseInt(cell.label.replace(/\D/g,''),10)||1,cell.label);toast(cell.label)}if(S.minesLives<=0){S.minesDone=true;S.stats.mines++}render()}
function openCase(id){const box=CASES.find(c=>c.id===id);if(!box)return;const price=Math.max(1,Math.round(box.price*(1-S.discount/100)));if(S.balance<price){toast(t('Не хватает баланса','Not enough balance'));return}S.balance-=price;const drop=pick(box.drops);reward(drop.k,drop.v,drop.l);S.caseResult=drop.l;S.stats.cases++;S.stats.spent+=price;syncSelf();toast(drop.l);render()}
function redeem(){const code=document.getElementById('promoCode').value.trim().toUpperCase(),promo=S.promos.find(p=>p.code===code);if(!promo){toast(t('Не найден','Not found'));return}if(promo.expires&&promo.expires<Date.now()){toast(t('Истёк','Expired'));return}if(promo.uses&&promo.used>=promo.uses){toast(t('Лимит','Limit'));return}if(S.promoHistory.some(h=>h.code===code)){toast(t('Уже активирован','Already used'));return}let effect='';if(promo.kind==='money'){S.balance+=promo.value;effect=`+${promo.value} ₽`}else if(promo.kind==='case'){const c=getCaseById(String(promo.value))||(S.customCases||[]).find(x=>x.id===String(promo.value));if(!c){toast(t('Кейс не найден','Case not found'));return}S.myCases=S.myCases||[];S.myCases.push({...c,gotAt:Date.now(),from:'promo'});effect=t('Кейс: ','Case: ')+(c.name||c.ru)}else if(promo.kind==='days'&&S.tariffId){S.subEnd=Math.max(Date.now(),S.subEnd)+promo.value*DAY;effect=`+${promo.value}d`}else if(promo.kind==='spins'){S.freeSpins+=promo.value;effect=`+${promo.value} spins`}else if(promo.kind==='dual'){S.dualUntil=Date.now()+promo.value*DAY;effect=t('Барабан+тап','Wheel+tap')}else if(promo.kind==='discount'){S.discount=Math.min(50,S.discount+promo.value);effect=`+${promo.value}%`}else{toast(t('Нужна подписка','Need plan'));return}promo.used++;S.promoHistory.unshift({code,at:Date.now(),effect});S.rewards=[{id:uid(),name:effect,kind:promo.kind,value:promo.value,at:Date.now(),applied:true},...(S.rewards||[])].slice(0,60);syncSelf();toast(effect);render()}
render();

</script>
